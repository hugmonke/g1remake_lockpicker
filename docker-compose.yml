version: '3.13.5'
services:
  backend:
    build: ./backend
    container_name: glockpicker-backend
    restart: unless-stopped
    ports:
      - "5555:8000"
    volumes:
      - ./backend/app:/backend/app

  frontend:
    build: ./frontend
    container_name: glockpicker-frontend
    restart: unless-stopped
    ports:
      - "7777:3000"
    volumes:
      - ./frontend/src:/frontend/src
      - ./frontend/public:/frontend/public
    depends_on:
      - backend